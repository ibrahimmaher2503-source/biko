name: BikeRide CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  analyze:
    name: Analyze & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: dart format --output none --set-exit-if-changed lib/ test/

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter test
      - run: flutter test --coverage
      - name: Check coverage
        run: |
          if [ -f coverage/lcov.info ]; then
            TOTAL_LINES=$(grep -c "DA:" coverage/lcov.info || echo 0)
            HIT_LINES=$(grep "DA:" coverage/lcov.info | grep -v ",0$" | wc -l || echo 0)
            if [ "$TOTAL_LINES" -gt 0 ]; then
              COVERAGE=$((HIT_LINES * 100 / TOTAL_LINES))
              echo "Coverage: ${COVERAGE}%"
              if [ "$COVERAGE" -lt 60 ]; then
                echo "::warning::Coverage ${COVERAGE}% is below 60% threshold"
              fi
            fi
          fi

  build-web:
    name: Build Admin Web
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build web --release --base-href /admin/ -t lib/main_admin.dart
