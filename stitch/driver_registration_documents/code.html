<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Driver Registration - Documents</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#e0062e",
                        "background-light": "#f8f5f6",
                        "background-dark": "#230f13",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"]
                    },
                    borderRadius: { "DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px" },
                },
            },
        }
    </script>
<style>
        /* Custom scrollbar hide for cleaner UI */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display antialiased text-slate-900 dark:text-slate-100 min-h-screen flex justify-center">
<div class="relative w-full max-w-md bg-white dark:bg-[#2a171b] min-h-screen shadow-xl overflow-x-hidden flex flex-col">
<!-- Header -->
<div class="flex items-center px-4 py-4 justify-between sticky top-0 bg-white/90 dark:bg-[#2a171b]/90 backdrop-blur-sm z-10 border-b border-gray-100 dark:border-white/5">
<button class="flex items-center justify-center p-2 rounded-full hover:bg-gray-100 dark:hover:bg-white/10 transition-colors">
<span class="material-symbols-outlined text-slate-900 dark:text-slate-100">arrow_back</span>
</button>
<h2 class="text-lg font-bold leading-tight flex-1 text-center pr-10">Driver Registration</h2>
<div class="absolute right-4 top-4">
<button class="text-primary text-sm font-bold hover:opacity-80 transition-opacity">Help</button>
</div>
</div>
<!-- Progress Indicator -->
<div class="flex w-full flex-row items-center justify-center gap-2 py-6">
<div class="h-1.5 w-8 rounded-full bg-primary/20 dark:bg-primary/10"></div>
<div class="h-1.5 w-8 rounded-full bg-primary"></div>
<div class="h-1.5 w-8 rounded-full bg-primary/20 dark:bg-primary/10"></div>
<div class="h-1.5 w-8 rounded-full bg-primary/20 dark:bg-primary/10"></div>
</div>
<div class="flex-1 overflow-y-auto px-6 pb-24">
<!-- Section Title -->
<h2 class="text-slate-900 dark:text-white text-2xl font-bold leading-tight pb-2 pt-2">Vehicle &amp; Documents</h2>
<p class="text-slate-500 dark:text-slate-400 text-sm mb-6">Please fill in your vehicle details and upload the required legal documents.</p>
<!-- Vehicle Form Fields -->
<div class="space-y-5">
<label class="block">
<span class="text-slate-900 dark:text-slate-200 text-sm font-semibold mb-2 block">Motorcycle Model</span>
<div class="relative">
<input class="form-input w-full rounded-xl border border-gray-200 dark:border-white/10 bg-background-light dark:bg-white/5 px-4 py-3.5 text-base text-slate-900 dark:text-white placeholder:text-slate-400 focus:border-primary focus:ring-1 focus:ring-primary transition-all outline-none" placeholder="e.g. Honda Wing 2022" type="text"/>
<span class="material-symbols-outlined absolute right-4 top-3.5 text-slate-400 pointer-events-none text-xl">two_wheeler</span>
</div>
</label>
<label class="block">
<span class="text-slate-900 dark:text-slate-200 text-sm font-semibold mb-2 block">Plate Number</span>
<div class="relative">
<input class="form-input w-full rounded-xl border border-gray-200 dark:border-white/10 bg-background-light dark:bg-white/5 px-4 py-3.5 text-base text-slate-900 dark:text-white placeholder:text-slate-400 focus:border-primary focus:ring-1 focus:ring-primary transition-all outline-none uppercase" placeholder="e.g. ABC 123" type="text"/>
<span class="material-symbols-outlined absolute right-4 top-3.5 text-slate-400 pointer-events-none text-xl">123</span>
</div>
</label>
</div>
<!-- Upload Documents Section -->
<div class="mt-8">
<h3 class="text-slate-900 dark:text-white text-lg font-bold mb-4">Required Documents</h3>
<div class="space-y-3">
<!-- Document Item: ID Card -->
<button class="w-full flex items-center p-4 rounded-xl border border-gray-100 dark:border-white/5 bg-background-light dark:bg-white/5 hover:bg-red-50 dark:hover:bg-red-900/10 hover:border-primary/30 transition-all group">
<div class="h-12 w-12 rounded-full bg-white dark:bg-white/10 flex items-center justify-center shadow-sm group-hover:scale-110 transition-transform duration-200">
<span class="material-symbols-outlined text-primary text-2xl">badge</span>
</div>
<div class="flex-1 ml-4 text-left">
<p class="text-slate-900 dark:text-white font-semibold text-sm">National ID Card</p>
<p class="text-slate-500 dark:text-slate-400 text-xs mt-0.5">Front and back side</p>
</div>
<div class="h-8 w-8 rounded-full border-2 border-dashed border-gray-300 dark:border-white/20 flex items-center justify-center group-hover:border-primary group-hover:bg-primary group-hover:text-white transition-colors">
<span class="material-symbols-outlined text-sm group-hover:text-white text-gray-400">add</span>
</div>
</button>
<!-- Document Item: License -->
<button class="w-full flex items-center p-4 rounded-xl border border-gray-100 dark:border-white/5 bg-background-light dark:bg-white/5 hover:bg-red-50 dark:hover:bg-red-900/10 hover:border-primary/30 transition-all group">
<div class="h-12 w-12 rounded-full bg-white dark:bg-white/10 flex items-center justify-center shadow-sm group-hover:scale-110 transition-transform duration-200">
<span class="material-symbols-outlined text-primary text-2xl">id_card</span>
</div>
<div class="flex-1 ml-4 text-left">
<p class="text-slate-900 dark:text-white font-semibold text-sm">Driving License</p>
<p class="text-slate-500 dark:text-slate-400 text-xs mt-0.5">Valid motorcycle license</p>
</div>
<div class="h-8 w-8 rounded-full bg-green-100 dark:bg-green-900/30 flex items-center justify-center">
<span class="material-symbols-outlined text-green-600 dark:text-green-400 text-sm font-bold">check</span>
</div>
</button>
<!-- Document Item: Vehicle Registration -->
<button class="w-full flex items-center p-4 rounded-xl border border-gray-100 dark:border-white/5 bg-background-light dark:bg-white/5 hover:bg-red-50 dark:hover:bg-red-900/10 hover:border-primary/30 transition-all group">
<div class="h-12 w-12 rounded-full bg-white dark:bg-white/10 flex items-center justify-center shadow-sm group-hover:scale-110 transition-transform duration-200">
<span class="material-symbols-outlined text-primary text-2xl">assignment</span>
</div>
<div class="flex-1 ml-4 text-left">
<p class="text-slate-900 dark:text-white font-semibold text-sm">Vehicle Registration</p>
<p class="text-slate-500 dark:text-slate-400 text-xs mt-0.5">Proof of ownership</p>
</div>
<div class="h-8 w-8 rounded-full border-2 border-dashed border-gray-300 dark:border-white/20 flex items-center justify-center group-hover:border-primary group-hover:bg-primary group-hover:text-white transition-colors">
<span class="material-symbols-outlined text-sm group-hover:text-white text-gray-400">add</span>
</div>
</button>
<!-- Document Item: Criminal Record -->
<button class="w-full flex items-center p-4 rounded-xl border border-gray-100 dark:border-white/5 bg-background-light dark:bg-white/5 hover:bg-red-50 dark:hover:bg-red-900/10 hover:border-primary/30 transition-all group">
<div class="h-12 w-12 rounded-full bg-white dark:bg-white/10 flex items-center justify-center shadow-sm group-hover:scale-110 transition-transform duration-200">
<span class="material-symbols-outlined text-primary text-2xl">verified_user</span>
</div>
<div class="flex-1 ml-4 text-left">
<p class="text-slate-900 dark:text-white font-semibold text-sm">Criminal Record</p>
<p class="text-slate-500 dark:text-slate-400 text-xs mt-0.5">Recent certificate (Fish w Tashbih)</p>
</div>
<div class="h-8 w-8 rounded-full border-2 border-dashed border-gray-300 dark:border-white/20 flex items-center justify-center group-hover:border-primary group-hover:bg-primary group-hover:text-white transition-colors">
<span class="material-symbols-outlined text-sm group-hover:text-white text-gray-400">add</span>
</div>
</button>
</div>
</div>
<!-- Tip Box -->
<div class="mt-6 p-4 rounded-lg bg-blue-50 dark:bg-blue-900/20 border border-blue-100 dark:border-blue-800/30 flex gap-3 items-start">
<span class="material-symbols-outlined text-blue-600 dark:text-blue-400 text-xl shrink-0 mt-0.5">info</span>
<p class="text-blue-900 dark:text-blue-100 text-xs leading-relaxed">
                    Ensure all photos are clear and text is readable. Blurry documents may delay your activation process.
                </p>
</div>
</div>
<!-- Sticky Bottom Button -->
<div class="absolute bottom-0 left-0 w-full p-6 bg-white dark:bg-[#2a171b] border-t border-gray-100 dark:border-white/5 shadow-[0_-8px_30px_rgba(0,0,0,0.04)]">
<button class="w-full bg-primary hover:bg-primary/90 text-white font-bold h-14 rounded-xl shadow-lg shadow-primary/30 flex items-center justify-center gap-2 transition-transform active:scale-[0.98]">
<span>Submit Application</span>
<span class="material-symbols-outlined text-xl">arrow_forward</span>
</button>
</div>
</div>
</body></html>
