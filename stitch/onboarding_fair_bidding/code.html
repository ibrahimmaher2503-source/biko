<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Onboarding: Fair Bidding</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&amp;family=Cairo:wght@400;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#e0062e",
                        "background-light": "#f8f5f6",
                        "background-dark": "#230f13",
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"],
                        "heading": ["Cairo", "sans-serif"],
                    },
                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
                },
            },
        }
    </script>

    body {

<body class="bg-background-light dark:bg-background-dark font-display antialiased overflow-hidden selection:bg-primary/20">

<div class="flex-1 flex flex-col items-center justify-center px-6 -mt-10">
<!-- Illustration Area -->
<div class="relative w-full aspect-square max-w-[320px] mb-8 flex items-center justify-center">
<!-- Abstract Background Shapes for depth -->
<div class="absolute inset-0 bg-primary/5 rounded-full blur-3xl transform scale-90"></div>
<div class="w-full h-full bg-center bg-contain bg-no-repeat z-10" data-alt="Illustration of two hands shaking with a red currency symbol between them representing fair deal" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuAEMO1hLx10ZO71I6hTqAX2YgZ0MAomWKwnH888-M83JlNx8Y3eIkQpPkIJUkbXyTpw-zjYFj7Vdxsa4MYt9VZqO8qPQqWpgHEAhgPPqb_pUHU_nndi9bJjfXAcYSlpV1YKzWECl6ZuTjcaUCkT9QV_4aBtxnCt7n5V6QJ0yPQ3YMS6buqUN9Rf39amFPGBpleCsYpE3SG6WX3uVt7UYftIPFwzimHbKsc4wtOeMKZ_-fU77sUI_i8wV_N2US2wLDcQHGS-bIc0sHFz");'></div>
</div>
<!-- Text Content -->
<div class="flex flex-col gap-4 text-center max-w-[320px]">
<h1 class="font-heading text-slate-900 dark:text-slate-100 text-[32px] font-bold leading-tight tracking-tight">
                    Your Price, <span class="text-primary">Your Choice</span>
</h1>
<p class="text-slate-500 dark:text-slate-400 text-base font-normal leading-relaxed">
                    Offer your own price and negotiate directly with drivers. No hidden fees, just fair deals for everyone involved.
                </p>
</div>
</div>
<!-- Footer / Controls -->
<div class="w-full flex flex-col gap-6 p-6 pb-10 bg-white dark:bg-background-dark">
<!-- Pagination Dots -->
<div class="flex w-full flex-row items-center justify-center gap-2">
<div class="h-2 w-2 rounded-full bg-slate-200 dark:bg-slate-700 transition-all"></div>
<div class="h-2 w-8 rounded-full bg-primary transition-all"></div>
<div class="h-2 w-2 rounded-full bg-slate-200 dark:bg-slate-700 transition-all"></div>
</div>
<!-- Primary Action -->
<button class="group relative flex w-full cursor-pointer items-center justify-center overflow-hidden rounded-xl h-14 bg-primary text-white text-lg font-bold shadow-lg shadow-primary/30 transition-all hover:bg-red-700 active:scale-[0.98]">
<span class="relative z-10 flex items-center gap-2">
                    Get Started
                    <span class="material-symbols-outlined text-[20px] group-hover:translate-x-1 transition-transform">arrow_forward</span>
</span>
