<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Driver: Delivery Completion</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#e0062e",
                        "background-light": "#f8f5f6",
                        "background-dark": "#1a1a1a",
                        "surface-light": "#ffffff",
                        "surface-dark": "#2d2d2d",
                    },
                    fontFamily: {
                        "display": ["Cairo", "Plus Jakarta Sans", "sans-serif"],
                        "sans": ["Cairo", "Plus Jakarta Sans", "sans-serif"],
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "2xl": "1rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        body {
            min-height: 100vh;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 overflow-hidden">
<div class="relative flex h-screen w-full flex-col overflow-hidden bg-white dark:bg-slate-900">
<div class="z-20 px-4 pt-12 pb-4 flex items-center justify-between bg-white dark:bg-slate-900 border-b border-slate-100 dark:border-slate-800">
<button class="flex size-10 items-center justify-center rounded-full text-slate-900 dark:text-slate-100 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
<span class="material-symbols-outlined">close</span>
</button>
<h1 class="text-lg font-bold">Delivery Summary</h1>
<button class="flex size-10 items-center justify-center rounded-full text-slate-900 dark:text-slate-100 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
<span class="material-symbols-outlined">help</span>
</button>
</div>
<div class="flex-1 overflow-y-auto px-6 py-6">
<div class="flex flex-col items-center justify-center text-center mb-8 animate-fade-in-up">
<div class="relative mb-6">
<div class="absolute inset-0 bg-green-100 dark:bg-green-900/30 rounded-full scale-150 animate-pulse"></div>
<div class="bg-green-500 rounded-full p-4 relative z-10 shadow-lg shadow-green-200 dark:shadow-green-900/20">
<span class="material-symbols-outlined text-white text-4xl">check</span>
</div>
</div>
<h2 class="text-2xl font-bold text-slate-900 dark:text-white mb-1">Destination Reached</h2>
<p class="text-slate-500 dark:text-slate-400 text-sm">You've arrived at the drop-off location.</p>
</div>
<div class="bg-surface-light dark:bg-surface-dark border border-slate-100 dark:border-slate-800 rounded-2xl shadow-sm p-6 mb-6 text-center">
<p class="text-sm font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-2">Cash to Collect</p>
<div class="text-4xl font-black text-primary mb-1">EGP 250</div>
<p class="text-xs text-slate-400 dark:text-slate-500">From Customer • Order #8821B</p>
<div class="mt-6 flex justify-center">
<div class="inline-flex items-center gap-2 px-3 py-1.5 rounded-lg bg-red-50 dark:bg-red-900/20 text-red-600 dark:text-red-400 text-sm font-medium">
<span class="material-symbols-outlined text-lg">warning</span>
                        Do not leave without cash
                     </div>
</div>
</div>
<div class="mb-6">
<h3 class="text-lg font-bold text-slate-900 dark:text-white mb-4 px-1">Verify Delivery</h3>
<div class="space-y-3">
<label class="flex items-start gap-4 p-4 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/50 cursor-pointer transition-all hover:border-primary/50">
<div class="relative flex items-center">
<input class="peer size-6 rounded border-slate-300 dark:border-slate-600 text-primary focus:ring-primary/20 bg-white dark:bg-slate-700" id="check1" type="checkbox"/>
<span class="absolute text-white opacity-0 peer-checked:opacity-100 top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 pointer-events-none">
<span class="material-symbols-outlined text-sm font-bold">check</span>
</span>
</div>
<div class="flex-1">
<p class="font-semibold text-slate-900 dark:text-slate-100 text-sm">Package Handed Over</p>
<p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">Confirm package was given to the recipient.</p>
</div>
</label>
<label class="flex items-start gap-4 p-4 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/50 cursor-pointer transition-all hover:border-primary/50">
<div class="relative flex items-center">
<input class="peer size-6 rounded border-slate-300 dark:border-slate-600 text-primary focus:ring-primary/20 bg-white dark:bg-slate-700" id="check2" type="checkbox"/>
<span class="absolute text-white opacity-0 peer-checked:opacity-100 top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 pointer-events-none">
<span class="material-symbols-outlined text-sm font-bold">check</span>
</span>
</div>
<div class="flex-1">
<p class="font-semibold text-slate-900 dark:text-slate-100 text-sm">Payment Collected</p>
<p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">Confirm you received the full amount of EGP 250.</p>
</div>
</label>
</div>
</div>
<div class="flex items-center justify-between px-2 py-3 border-t border-slate-100 dark:border-slate-800">
<div class="flex items-center gap-3">
<div class="size-10 rounded-full bg-slate-200 dark:bg-slate-700 flex items-center justify-center">
<span class="material-symbols-outlined text-slate-500 dark:text-slate-400">apartment</span>
</div>
<div>
<p class="text-sm font-bold text-slate-900 dark:text-white">TechHub Cairo</p>
<p class="text-xs text-slate-500 dark:text-slate-400">Recipient</p>
</div>
</div>
<button class="text-primary text-sm font-semibold">Report Issue</button>
</div>
</div>
<div class="bg-white dark:bg-slate-900 p-4 border-t border-slate-100 dark:border-slate-800 shadow-[0_-4px_20px_rgba(0,0,0,0.05)]">
<button class="w-full flex items-center justify-center gap-2 rounded-xl bg-primary py-4 text-center text-lg font-bold text-white shadow-lg shadow-primary/30 active:scale-[0.98] transition-transform hover:bg-red-700">
<span>Confirm Delivery</span>
<span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
</div>

</body></html>
