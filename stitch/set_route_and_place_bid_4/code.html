</div>

<div class="absolute inset-x-0 bottom-0 z-30 flex flex-col justify-end h-[60%]">

<div class="mb-6">

<div class="grid grid-cols-3 gap-3">
<button class="flex flex-col items-center justify-center gap-2 p-3 rounded-xl border-2 border-primary bg-primary/5">
<span class="material-symbols-outlined text-primary text-3xl">devices</span>
<span class="text-xs font-bold text-primary">Electronics</span>
</button>
<button class="flex flex-col items-center justify-center gap-2 p-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 opacity-70">

<span class="text-xs font-medium text-slate-500 dark:text-slate-400">Food</span>
</button>

</button>

<span class="material-symbols-outlined text-slate-400 text-3xl">medication</span>
<span class="text-xs font-medium text-slate-500 dark:text-slate-400">Meds</span>
</button>
<button class="flex flex-col items-center justify-center gap-2 p-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 opacity-70">
<span class="material-symbols-outlined text-slate-400 text-3xl">inventory_2</span>
<span class="text-xs font-medium text-slate-500 dark:text-slate-400">Other</span>
</button>
</div>
</div>
<div class="mb-6">
<label class="text-sm font-semibold text-slate-500 dark:text-slate-400 mb-3 block">Package Weight</label>
<div class="flex bg-slate-100 dark:bg-slate-800 p-1 rounded-xl">
<button class="flex-1 py-2 text-sm font-semibold rounded-lg bg-white dark:bg-slate-700 text-slate-900 dark:text-white shadow-sm transition-all">Small</button>
<button class="flex-1 py-2 text-sm font-medium rounded-lg text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 transition-all">Medium</button>
<button class="flex-1 py-2 text-sm font-medium rounded-lg text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 transition-all">Large</button>
</div>
<p class="text-xs text-slate-400 mt-2 ml-1">Max 5kg • Fits in a backpack</p>
</div>

</div>
</div>

</button>

</div>
