<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Merchant Vendor Registration</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#e0062e",
                        "background-light": "#f8f5f6",
                        "background-dark": "#230f13",
                    },
                    fontFamily: {
                        "display": ["Cairo", "Plus Jakarta Sans", "sans-serif"],
                        "sans": ["Cairo", "Plus Jakarta Sans", "sans-serif"],
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        body {
            min-height: max(800px, 100dvh);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 antialiased overflow-x-hidden">
<div class="relative flex h-full min-h-screen w-full flex-col">
<div class="sticky top-0 z-20 flex items-center justify-between px-4 py-4 bg-background-light dark:bg-background-dark/95 backdrop-blur-md">
<button class="flex size-10 items-center justify-center rounded-full bg-white dark:bg-slate-800 shadow-sm text-slate-900 dark:text-slate-100 border border-slate-100 dark:border-slate-700">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="text-lg font-bold text-slate-900 dark:text-white">Vendor Setup</h1>
<div class="size-10"></div> 
</div>
<main class="flex-1 px-5 pb-8 pt-2">
<div class="mb-6">
<h2 class="text-2xl font-bold text-slate-900 dark:text-white mb-2">Register your Business</h2>
<p class="text-sm text-slate-500 dark:text-slate-400">Fill in your store details to start receiving delivery orders.</p>
</div>
<form class="space-y-6" onsubmit="event.preventDefault();">
<div class="space-y-2">
<label class="text-sm font-semibold text-slate-700 dark:text-slate-300" for="businessName">Business Name</label>
<div class="relative">
<span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 material-symbols-outlined text-[20px]">storefront</span>
<input class="w-full rounded-xl border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 py-3.5 pl-11 pr-4 text-slate-900 dark:text-white placeholder:text-slate-400 focus:border-primary focus:ring-primary shadow-sm outline-none transition-all" id="businessName" placeholder="e.g. Al-Amal Pharmacy" type="text"/>
</div>
</div>
<div class="space-y-2">
<label class="text-sm font-semibold text-slate-700 dark:text-slate-300">Business Type</label>
<div class="grid grid-cols-2 gap-3">
<label class="cursor-pointer relative">
<input checked="" class="peer sr-only" name="businessType" type="radio"/>
<div class="flex flex-col items-center justify-center rounded-xl border-2 border-slate-100 dark:border-slate-700 bg-white dark:bg-slate-800 p-4 text-slate-500 transition-all peer-checked:border-primary peer-checked:bg-primary/5 peer-checked:text-primary dark:peer-checked:bg-primary/20">
<span class="material-symbols-outlined mb-2 text-2xl">local_pharmacy</span>
<span class="text-sm font-semibold">Pharmacy</span>
</div>
</label>
<label class="cursor-pointer relative">
<input class="peer sr-only" name="businessType" type="radio"/>
<div class="flex flex-col items-center justify-center rounded-xl border-2 border-slate-100 dark:border-slate-700 bg-white dark:bg-slate-800 p-4 text-slate-500 transition-all peer-checked:border-primary peer-checked:bg-primary/5 peer-checked:text-primary dark:peer-checked:bg-primary/20">
<span class="material-symbols-outlined mb-2 text-2xl">apparel</span>
<span class="text-sm font-semibold">Boutique</span>
</div>
</label>
<label class="cursor-pointer relative">
<input class="peer sr-only" name="businessType" type="radio"/>
<div class="flex flex-col items-center justify-center rounded-xl border-2 border-slate-100 dark:border-slate-700 bg-white dark:bg-slate-800 p-4 text-slate-500 transition-all peer-checked:border-primary peer-checked:bg-primary/5 peer-checked:text-primary dark:peer-checked:bg-primary/20">
<span class="material-symbols-outlined mb-2 text-2xl">grocery</span>
<span class="text-sm font-semibold">Grocery</span>
</div>
</label>
<label class="cursor-pointer relative">
<input class="peer sr-only" name="businessType" type="radio"/>
<div class="flex flex-col items-center justify-center rounded-xl border-2 border-slate-100 dark:border-slate-700 bg-white dark:bg-slate-800 p-4 text-slate-500 transition-all peer-checked:border-primary peer-checked:bg-primary/5 peer-checked:text-primary dark:peer-checked:bg-primary/20">
<span class="material-symbols-outlined mb-2 text-2xl">restaurant</span>
<span class="text-sm font-semibold">Restaurant</span>
</div>
</label>
</div>
</div>
<div class="space-y-2">
<div class="flex items-center justify-between">
<label class="text-sm font-semibold text-slate-700 dark:text-slate-300">Store Location</label>
<button class="text-xs font-bold text-primary hover:text-primary/80 transition-colors">Edit Location</button>
</div>
<div class="relative h-40 w-full overflow-hidden rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm bg-slate-100 dark:bg-slate-800">
<div class="absolute inset-0 bg-cover bg-center opacity-80" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuCVNNkLoZL2rM8nCnjB9Nbmbn2gZ544KC78cYjan_YvPsHaO2jJrKq8CEjGene0kUBkQYByumXLAt4ghdLD_cbJbPPuuJEqBHAVsX--zI0QHgvrKS15kK8ShhG0q6gvWaOUTm23CP83cmkOI3sQw69pZ_lKQZ8qc6tZRI9IF0GjATE8xpZ_cg2MaocvvjbuLLCDP3VNbRzjEUAIoSpcJZFzVRxI3RDUCbhnwenUeiyCua5NhXi9TRj8AHmTjenFz5y_sNXr9r3FTd4x");'></div>
<div class="absolute inset-0 bg-gradient-to-t from-black/50 to-transparent"></div>
<div class="absolute inset-0 flex items-center justify-center pb-4">
<div class="relative flex flex-col items-center">
<div class="relative z-10 flex size-8 items-center justify-center rounded-full bg-primary text-white shadow-lg shadow-primary/40 animate-bounce">
<span class="material-symbols-outlined text-lg">store</span>
</div>
<div class="mt-1 h-1.5 w-6 rounded-[100%] bg-black/30 blur-[2px]"></div>
</div>
</div>
<div class="absolute bottom-3 left-3 right-3 rounded-lg bg-white dark:bg-slate-900 p-2.5 shadow-md flex items-center gap-3">
<div class="flex size-8 shrink-0 items-center justify-center rounded-full bg-slate-100 dark:bg-slate-800 text-primary">
<span class="material-symbols-outlined text-[18px]">near_me</span>
</div>
<div class="flex-1 overflow-hidden">
<p class="truncate text-xs font-bold text-slate-900 dark:text-white">58 El-Thawra St., Heliopolis</p>
<p class="truncate text-[10px] text-slate-500">Cairo, Egypt</p>
</div>
</div>
</div>
</div>
<div class="space-y-2">
<label class="text-sm font-semibold text-slate-700 dark:text-slate-300" for="phoneNumber">Owner Phone Number</label>
<div class="relative flex items-center">
<div class="absolute left-4 top-1/2 -translate-y-1/2 flex items-center gap-1 border-r border-slate-200 dark:border-slate-700 pr-2">
<span class="text-sm font-bold text-slate-600 dark:text-slate-400">+20</span>
</div>
<input class="w-full rounded-xl border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 py-3.5 pl-16 pr-4 text-slate-900 dark:text-white placeholder:text-slate-400 focus:border-primary focus:ring-primary shadow-sm outline-none transition-all" id="phoneNumber" placeholder="10 1234 5678" type="tel"/>
</div>
</div>
<div class="pt-4">
<button class="w-full rounded-xl bg-primary py-4 text-center text-lg font-bold text-white shadow-lg shadow-primary/30 active:scale-[0.98] transition-transform hover:bg-red-700">
                    Register as Vendor
                </button>
<p class="mt-4 text-center text-xs text-slate-400 px-4">
                    By registering, you agree to our <a class="text-primary font-medium" href="#">Terms of Service</a> and <a class="text-primary font-medium" href="#">Privacy Policy</a>.
                </p>
</div>
</form>
</main>
</div>

</body></html>
